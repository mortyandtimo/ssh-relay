# SSH Relay nginx reverse proxy for tunnel.020309.top
# Include this in your main nginx config or cert-keeper managed config.

server {
    listen 443 ssl http2;
    server_name tunnel.020309.top;

    ssl_certificate     /etc/cloud-relay/cert-keeper/certs/tunnel.020309.top.fullchain.pem;
    ssl_certificate_key /etc/cloud-relay/cert-keeper/certs/tunnel.020309.top.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # API endpoints (includes WebSocket/Upgrade support for reverse tunnel)
    location /api/ {
        proxy_pass http://127.0.0.1:7722;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:7722;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Default: return API info
    location / {
        default_type application/json;
        return 200 '{"service":"ssh-relay","domain":"tunnel.020309.top","docs":"/api/"}';
    }
}

# HTTP redirect
server {
    listen 80;
    server_name tunnel.020309.top;
    return 301 https://$server_name$request_uri;
}
